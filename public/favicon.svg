<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#glowGrad)" opacity="0.3" filter="blur(8px)"/>

  <!-- User Avatar Glyph -->
  <!-- Head -->
  <circle cx="32" cy="23" r="9" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Shoulders / Torso -->
  <path d="M16 47 C16 38, 23 35, 32 35 C41 35, 48 38, 48 47" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
</svg>
